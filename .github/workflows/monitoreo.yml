name: Monitoreo Cargadores Providencia

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - monitor_cloud.py
      - config.json
      - exportar_datos.py
      - publicar_powerbi.py
      - .github/workflows/monitoreo.yml

permissions:
  contents: write

concurrency:
  group: monitoreo-cargadores
  cancel-in-progress: false

jobs:
  recolectar-datos:
    # Evita consumir minutos privados si alguien cambia la visibilidad o usa un fork.
    if: github.event.repository.private == false && github.repository == 'Arielmild/monitoreo-cargadores-providencia'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar la versión más reciente de main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1
      - name: Configurar Python
        id: preparar_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Capturar datos públicos
        id: captura
        run: python monitor_cloud.py
      - name: Exportar días cerrados para Power BI si corresponde
        id: exportacion_diaria
        if: ${{ !cancelled() && steps.preparar_python.outcome == 'success' }}
        continue-on-error: true
        run: python exportar_datos.py --power-bi --si-pendiente
      - name: Guardar la captura
        if: ${{ !cancelled() && (steps.captura.outcome == 'success' || steps.exportacion_diaria.outcome == 'success') }}
        env:
          EXPORTACION_CORRECTA: ${{ steps.exportacion_diaria.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- datos/
          if [ "$EXPORTACION_CORRECTA" = "success" ] && [ -f powerbi/archivos.csv ]; then
            git add -- powerbi/
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "datos: captura UTC $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          for intento in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            # El commit ya existe: ahora sí puede hacerse rebase sin cambios pendientes.
            git fetch origin main
            git rebase origin/main
          done
          exit 1
      - name: Informar un fallo de exportación sin perder la captura guardada
        if: ${{ !cancelled() && steps.exportacion_diaria.outcome == 'failure' }}
        run: |
          echo "Falló la exportación diaria. Se reintentará en la próxima activación."
          exit 1
